[project]
name = "sama-worker"
version = "0.1.0"
description = "Sama Agent — worker IA (ASR Kiriku, LLM NVIDIA, Journey déterministe, TTS xTTS wolof)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "python-multipart>=0.0.19",
    "livekit-api>=0.9",
    "livekit-agents>=1.0",
    "livekit>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt[crypto]>=2.9",
    "torch>=2.4",
    "transformers>=4.46",
    # Kiriku est chargé avec low_cpu_mem_usage : transformers exige accelerate.
    "accelerate>=0.26",
    "numpy>=1.26",
    # Voix de l'agent (repli réel quand xTTS wolof n'a pas de poids) : Edge neural FR.
    "edge-tts>=6.1",
    "miniaudio>=1.59",
]

[project.optional-dependencies]
# xTTS (GalsenAI wolof) — lourd, installé sur le nœud GPU Brev
tts = ["TTS>=0.22"]

[tool.setuptools]
# Découverte automatique des paquets du worker (architecture hexagonale :
# agent.domain, agent.application, agent.infrastructure, agent.api, agent.voice…).
[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]